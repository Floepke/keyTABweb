<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VectorPDF Example</title>
    <style>
      body { font-family: sans-serif; margin: 24px; }
      button { font-size: 16px; padding: 8px 12px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg2pdf.js"></script>
    <script src="./vector_pdf.js"></script>
  </head>
  <body>
    <button id="download">Generate vector PDF</button>

    <script>
      const drawExample = () => {
        const doc = new VectorPDF();

        doc.new_page(210, 297);
        doc.new_line(10, 10, 100, 10, "round", "round", "#ff0000", [2, 2]);
        doc.new_rect(10, 20, 80, 60, "square", "bevel", "#0000ff", "#dce6ff", [4, 2]);
        doc.new_polygon([[90, 20], [130, 20], [150, 50], [100, 70]], "round", "miter", "#008000", "#e7ffe7", null);
        doc.new_polyline([[10, 80], [30, 110], [60, 90], [90, 120], [120, 95]], "round", "round", "#111111", [3, 2]);
        doc.new_oval(130, 80, 190, 130, "#aa00aa", "#ffe6ff", [1.5, 1.5], 0.3, 0);

        doc.new_page(148, 210);
        doc.new_line(10, 10, 130, 180, "butt", "miter", "#333333", null);
        doc.new_rect(20, 20, 120, 80, "butt", "miter", "#f57c00", null, [5, 3]);
        doc.new_polygon([[20, 110], [70, 90], [120, 120], [90, 170], [40, 160]], "round", "round", "#0277bd", "#e1f5fe", [2, 1]);
        doc.new_polyline([[20, 190], [40, 180], [60, 195], [80, 175], [120, 190]], "round", "bevel", "#2e7d32", null);
        doc.new_oval(30, 130, 70, 170, "#6a1b9a", null, null, 0, -0.2);

        return doc;
      };

      document.getElementById("download").addEventListener("click", async () => {
        const doc = drawExample();
        await doc.save("vector-example.pdf");
      });
    </script>
  </body>
</html>
